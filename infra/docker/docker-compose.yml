services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devlens
      POSTGRES_USER: devlens
      POSTGRES_PASSWORD: devlens
    ports:
      - "55452:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlens -d devlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devlens
      MINIO_ROOT_PASSWORD: devlens-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://devlens:devlens@postgres:5432/devlens
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: local-development-secret
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run db:push -w @devlens/database && npm run dev -w @devlens/api"
    ports:
      - "4000:4000"

  ai-service:
    build:
      context: ../..
      dockerfile: apps/ai-service/Dockerfile
    environment:
      AI_SERVICE_PORT: 8000
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    ports:
      - "8000:8000"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

  repository-worker:
    build:
      context: ../..
      dockerfile: apps/repository-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://devlens:devlens@postgres:5432/devlens
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  knowledge-worker:
    build:
      context: ../..
      dockerfile: apps/knowledge-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://devlens:devlens@postgres:5432/devlens
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres-data:
  qdrant-data:
  minio-data:
